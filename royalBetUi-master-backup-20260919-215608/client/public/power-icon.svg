<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldFill" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="boltShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#1e6bff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Crest / shield: angular cut top corners, sharp point at base = authority -->
  <path d="M18 3 L46 3 L60 15 L60 33 L32 61 L4 33 L4 15 Z"
        fill="url(#shieldFill)" stroke="#1e6bff" stroke-width="1.6" stroke-linejoin="miter"/>

  <!-- Faceted gem-cut lines = elegance -->
  <path d="M18 3 L32 20 L46 3" fill="none" stroke="#1e6bff" stroke-opacity="0.55" stroke-width="0.8"/>
  <path d="M4 15 L32 20 L60 15" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.8"/>
  <path d="M4 33 L32 20 L60 33" fill="none" stroke="#1e6bff" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Diagonal sheen sweep = elegance -->
  <path d="M18 3 L46 3 L60 15 L60 20 L14 6 Z" fill="url(#edgeHi)"/>

  <!-- Bolt = power, cuts through the crest -->
  <path d="M35.5 9 L21 33 L29.5 33 L26 55 L45 27 L34.5 27 Z"
        fill="#F4F1F0" filter="url(#boltShadow)"/>

  <!-- Outer edge highlight for a crisp, premium silhouette -->
  <path d="M18 3 L46 3 L60 15 L60 33 L32 61 L4 33 L4 15 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.6"/>
</svg>
